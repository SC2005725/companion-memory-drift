<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ===== 手机「装成 App」所需（PWA） =====
     桌面独立图标、全屏无地址栏、单独任务栈。
     注意：Chrome 只在【HTTPS 或 localhost】下才允许安装；局域网明文 http 装不上。 -->
<link rel="manifest" href="/webui.webmanifest">
<meta name="theme-color" content="#f6f7fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鹤辞">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function (e) {
      console.warn('SW 注册失败（不影响使用）:', e && e.message);
    });
  });
}
</script>
<title>鹤辞</title>
<style>
  :root{
    /* Muse 原生浅色极简体系 + Apple 空间精密可视化令牌 */
    --paper:#f6f7fb; --paper-deep:rgba(29,34,48,.05); --panel:rgba(255,255,255,.72); --panel-2:rgba(255,255,255,.55);
    --hairline:rgba(29,34,48,.08); --hairline-2:rgba(29,34,48,.05);
    --ink:#1c1e21; --ink-2:#44484d; --dim:#5f6266; --dim-2:#63666c;
    --accent:#0866ff; --accent-deep:#0356c9; --accent-soft:#e7f0ff;
    --ok:#31a24c; --ok-soft:#e7f6ec;
    --warn:#8a5300; --warn-soft:#fdf2e3;
    --err:#c5221f; --err-soft:#fce8e6;
    --bubble:rgba(255,255,255,.92); --me:linear-gradient(135deg,#e3effe,#e6f7f1);
    --r-lg:22px; --r:16px; --r-sm:12px;
    --sh-1:0 2px 10px rgba(20,30,40,.045);
    --sh-2:0 12px 32px rgba(20,30,40,.14);
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,SimSun,Georgia,serif;
  }
  *{box-sizing:border-box}
  .hide{display:none !important}
  html,body{height:100%;margin:0}
  body{
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--paper); color:var(--ink); display:flex; overflow:hidden;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#c3cad6;border-radius:8px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#aeb7c4;background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  ::selection{background:#d7e3ff; color:var(--ink)}

  /* ---------- 主区与顶栏 ---------- */
  main{flex:1; display:flex; flex-direction:column; min-width:0}
  header{
    padding:10px 16px 0; position:relative; background:transparent; border:0;
    display:flex; align-items:flex-start; flex-shrink:0; box-shadow:none; z-index:2;
  }
  .chat-ava{
    position:absolute; left:50%; top:8px; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; z-index:3;
  }
  .avatar{
    width:56px;height:56px;border-radius:50%;flex-shrink:0;object-fit:cover;
    display:grid;place-items:center;
    box-shadow:var(--sh-1);
    transition:transform .2s cubic-bezier(.2,.8,.2,1);
  }
  .avatar:hover{transform:scale(1.04)}
  .seal{
    width:56px;height:56px;border-radius:50%;flex-shrink:0;
    background:var(--accent); color:#fff; display:grid; place-items:center;
    font:700 22px/1 inherit; box-shadow:var(--sh-1);
  }
  .namepill{
    background:var(--panel); border-radius:999px; padding:4px 16px; margin-top:-14px;
    font-size:14px; font-weight:650; color:var(--ink); box-shadow:var(--sh-1);
    position:relative; z-index:2;
  }
  header .sub{color:var(--dim); font-size:11px; margin-top:4px; white-space:nowrap}
  #conn{display:none}

  /* ---------- 对话流 ---------- */
  #log{flex:1; overflow-y:auto; padding:108px 16px 12px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth; max-width:760px; width:100%; margin:0 auto}
  .row{display:flex; flex-direction:column; max-width:720px; width:100%}
  .row.me{align-self:flex-end; align-items:flex-end}
  @media (prefers-reduced-motion: no-preference){
    .row{animation:rise .26s cubic-bezier(.2,.8,.3,1)}
    @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  }
  .bubble{
    position:relative; background:var(--bubble); border:0;
    border-radius:22px; border-bottom-left-radius:8px;
    padding:12px 16px; white-space:pre-wrap; word-break:break-word; min-width:0;
    color:var(--ink); max-width:calc(100% - 24px);
  }
  .row.me .bubble{
    background:var(--me); border-radius:22px; border-bottom-left-radius:22px; border-bottom-right-radius:8px;
  }
  .meta{font-size:12px; color:var(--dim); margin-top:6px; display:flex; flex-wrap:wrap; gap:4px 14px; align-items:baseline}
  .chip{background:none; border:0; border-radius:0; padding:0; font-size:12px; font-weight:500; color:var(--dim)}
  .chip.deny{color:var(--err)}
  .chip.ok{color:var(--dim)}
  .chip.warn{color:var(--warn)}
  .err{color:var(--err); font-size:13px; background:var(--err-soft); border:1px solid #ecd2c8;
       border-radius:var(--r-sm); padding:11px 15px; max-width:840px}
  .tip{color:var(--dim); font-size:13.5px; text-align:center; padding:60px 16px; line-height:2}
  .tip b{font:700 20px/1.4 inherit; color:var(--ink); display:block; margin-bottom:6px}

  /* ---------- 输入栏 ---------- */
  .composer{
    padding:12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background:transparent; border-top:0;
    display:flex; gap:0; align-items:flex-end; flex-shrink:0; z-index:2;
    max-width:760px; width:100%; margin:0 auto;
  }
  .inputwrap{flex:1; display:flex; align-items:flex-end; background:var(--bubble);
    border:0; border-radius:999px; transition:background .15s, box-shadow .15s}
  .inputwrap:focus-within{background:var(--panel); box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{
    flex:1; resize:none; border:0; border-radius:999px;
    padding:12px 6px; font:inherit; outline:none; max-height:180px; min-height:24px;
    background:transparent; color:var(--ink); line-height:1.6
  }
  textarea::placeholder{color:var(--dim-2)}
  button{
    border:0; border-radius:999px; padding:0 22px; height:44px; font:inherit; font-weight:650;
    background:var(--accent); color:#fff; cursor:pointer;
    flex-shrink:0; transition:filter .12s, opacity .15s, transform .08s; box-shadow:none;
  }
  button:hover:not(:disabled){filter:brightness(1.08)}
  button:active:not(:disabled){filter:brightness(.92); transform:translateY(1px)}
  button:disabled{opacity:.45; cursor:default}
  button[data-dec="deny"]{background:var(--paper-deep); color:var(--ink); border:0}
  button[data-dec="deny"]:hover:not(:disabled){background:#dcdfe6; filter:none}
  .sendbtn{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;margin:5px;padding:0;display:grid;place-items:center}
  .sendbtn:disabled{background:#c3cdda; color:#fff; opacity:1}

  /* ---- 遮罩 / 轻提示 / 重试 ---- */
  .scrim{position:fixed; inset:0; z-index:7; background:rgba(20,30,40,.34); opacity:0; pointer-events:none; transition:opacity .2s}
  body.rail-open .scrim{opacity:1; pointer-events:auto}
  #toast{position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,8px);
    background:#33302a; color:#fdfcf9; font-size:13px; padding:9px 16px; border-radius:20px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:70; box-shadow:var(--sh-2); max-width:82vw; text-align:center}
  #toast.on{opacity:.97; transform:translate(-50%,0)}
  .err-row{display:flex; gap:10px; align-items:center; max-width:840px}
  .retry{height:36px; padding:0 18px; font-size:13.5px; border-radius:999px; background:var(--panel); color:var(--accent); border:0; box-shadow:var(--sh-1); font-weight:650}
  .retry:hover:not(:disabled){filter:none; background:var(--panel-2)}
  details.more{margin-top:8px}
  details.more summary{cursor:pointer; font-size:12.5px; color:var(--accent-deep); list-style:none; padding:4px 0}
  details.more summary::-webkit-details-marker{display:none}
  details.more summary:hover{text-decoration:underline; text-underline-offset:3px}
  details.more ul{margin-top:4px}

  /* ---------- 抽屉导航（Muse 选项卡式） ---------- */
  #drawer{
    position:fixed; left:12px; top:12px; bottom:12px; width:min(300px,84vw); z-index:40;
    background:var(--panel); border-radius:24px; transform:translateX(-330px); transition:transform .28s cubic-bezier(.22,1,.36,1);
    padding:22px 14px; overflow-y:auto;
  }
  #drawer.open{transform:translateX(0); box-shadow:0 12px 40px rgba(20,30,40,.18)}
  .drawer-title{font:700 26px/1.2 inherit; color:var(--ink); margin:0 0 24px 10px}
  .drawer-label{font-size:13px; color:var(--dim); margin:0 10px 10px}
  .navitem{
    width:100%; display:flex; align-items:center; gap:14px; background:none; border:0;
    border-radius:14px; padding:13px 14px; font:500 16px/1.2 inherit; color:var(--ink);
    cursor:pointer; text-align:left; transition:background .15s; height:auto;
  }
  .navitem svg{flex-shrink:0}
  .navitem:hover{background:var(--panel-2); filter:none; transform:none}
  .navitem.on{background:#e7eaf3; font-weight:600}
  .drawer-sep{height:1px; background:var(--hairline-2); margin:12px 10px}

  /* 2026-11-21：界面元素禁用文字选中 —— 手机上长按导航/头部/输入栏时，
     WebView 会把它们当普通文字选中，弹出生硬的矩形高亮和「复制/分享」工具条。
     消息气泡（#log 内）刻意保留可选中：用户仍可长按复制鹤辞的回复。 */
  #drawer, #drawer *, header, header *, #menu, .inputwrap, .inputwrap *,
  .pvbox, .pvbox *, .tip {
    -webkit-user-select: none; user-select: none;
  }
  *{ -webkit-tap-highlight-color: transparent; }

  #menu{
    width:44px; height:44px; border-radius:50%; background:var(--panel); border:0;
    box-shadow:var(--sh-1); display:grid; place-items:center; color:var(--ink);
    cursor:pointer; padding:0; flex-shrink:0;
  }
  #menu:hover{box-shadow:var(--sh-2); filter:none; transform:none}

  /* ---------- 二级页面 ---------- */
  .page{display:none; flex-direction:column; flex:1; min-height:0}
  .page.on{display:flex}
  .page-scroll{flex:1; overflow-y:auto; padding:0 16px 36px; max-width:860px; width:100%; margin:0 auto}
  .pagetitle{font:700 28px/1.3 inherit; color:var(--ink); margin:8px 0 16px; letter-spacing:-0.4px}

  /* ---- 卡片（Muse 纯白无边框 + Apple 空间质感） ---- */
  .card{border:0; border-radius:var(--r-lg); padding:18px 20px; margin-bottom:14px;
    background:var(--panel); box-shadow:var(--sh-1)}
  .card h2{
    font-size:14.5px; margin:0 0 12px; color:var(--ink); font-weight:700;
    letter-spacing:0; display:flex; align-items:center; gap:8px
  }
  .card h2 .n{margin-left:auto; letter-spacing:0; color:var(--dim); font-weight:600; font-size:12.5px;
    font-variant-numeric:tabular-nums}
  ul{margin:0; padding-left:18px}
  li{margin:6px 0; font-size:13.5px; color:var(--ink-2); line-height:1.65}
  li::marker{color:var(--dim-2)}
  .muted{color:var(--dim); font-size:13px; line-height:1.65}
  .tag{
    display:inline-block; font-size:11.5px; border-radius:999px; padding:2px 10px;
    background:var(--panel-2); color:var(--ink-2); margin:2px 4px 2px 0; font-weight:600
  }
  .tag.on{background:var(--accent-soft); color:var(--accent-deep)}
  .tag.off{background:var(--err-soft); color:var(--err)}
  .tag.warn{background:var(--warn-soft); color:var(--warn)}

  /* =========================================================
     模块一：Apple Fitness 风格【同心共生环】（状态页）
     ========================================================= */
  .stagepath{display:flex; margin:4px 0 16px}
  .sp-node{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative}
  .sp-node i{width:10px; height:10px; border-radius:50%; background:var(--hairline); display:block; position:relative; z-index:1; transition:all .3s ease}
  .sp-node.done i{background:var(--accent)}
  .sp-node.now i{background:var(--accent-deep); box-shadow:0 0 0 4px var(--accent-soft)}
  .sp-node+.sp-node::before{content:''; position:absolute; top:4.5px; left:calc(-50% + 6px); right:calc(50% + 6px); height:2px; background:var(--hairline)}
  .sp-node.done+.sp-node::before{background:var(--accent)}
  .sp-node span{font-size:11px; color:var(--dim-2); line-height:1}
  .sp-node.done span{color:var(--ink-2)}
  .sp-node.now span{color:var(--accent-deep); font-weight:700}

  .rings-layout{display:grid; grid-template-columns:220px 1fr; gap:20px; align-items:center; margin:4px 0 10px}
  .rings-stage{position:relative; width:220px; height:220px; margin:0 auto}
  .rings-svg{width:100%; height:100%; transform:rotate(-90deg); overflow:visible}
  .ring-track{fill:none; stroke-width:13; stroke-linecap:round; opacity:.14}
  .ring-fill{fill:none; stroke-width:13; stroke-linecap:round; cursor:pointer;
    transition:stroke-dashoffset .85s cubic-bezier(.22,1,.36,1), filter .2s, opacity .2s}
  .ring-fill:hover,.ring-fill.hi{filter:drop-shadow(0 0 6px rgba(8,102,255,.45))}
  .rings-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; text-align:center}
  .rings-center b{font:700 22px/1.15 inherit; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:-.5px}
  .rings-center span{font-size:11px; color:var(--dim); margin-top:2px; font-weight:600}

  .rings-legend{display:flex; flex-direction:column; gap:8px}
  .r-row{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:14px; background:var(--panel-2);
    cursor:pointer; border:0; width:100%; text-align:left; height:auto; transition:background .16s, box-shadow .16s}
  .r-row:hover,.r-row.active{background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px rgba(8,102,255,.28); filter:none; transform:none}
  .r-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0}
  .r-name{font-size:13px; font-weight:650; color:var(--ink)}
  .r-desc{font-size:11.5px; color:var(--dim); margin-left:4px}
  .r-val{margin-left:auto; font-size:13px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
  @media (max-width:600px){ .rings-layout{grid-template-columns:1fr; gap:14px} }

  .evlist{margin-top:12px; display:flex; flex-direction:column}
  .ev{display:flex; gap:9px; font-size:12.5px; align-items:baseline; padding:7px 0; border-top:1px solid var(--hairline-2)}
  .ev:first-child{border-top:0}
  .ev-d{color:var(--dim-2); font-variant-numeric:tabular-nums; flex-shrink:0}
  .ev-t{color:var(--accent-deep); font-weight:650; flex-shrink:0}
  .ev-m{color:var(--dim); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  /* 数据磁贴 */
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .tile{background:var(--panel-2); border:0; border-radius:16px; padding:14px 8px; text-align:center}
  .tile b{display:block; font:700 20px/1.2 inherit; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:-0.3px}
  .tile span{font-size:11px; color:var(--dim); margin-top:3px; display:block}

  .note{background:none; border:0; border-radius:0; padding:10px 0; margin:0}
  .note + .note{border-top:1px solid var(--hairline-2)}
  .note-msg{font-size:14px; font-weight:600; color:var(--ink); line-height:1.55}

  /* =========================================================
     模块二：空间光晕【情感极光场】（情感页）
     ========================================================= */
  .aurora-stage{
    position:relative; height:210px; border-radius:18px; overflow:hidden;
    background:linear-gradient(145deg, #0b152c 0%, #102042 52%, #0c1830 100%);
    margin-bottom:14px; display:flex; flex-direction:column; justify-content:space-between;
    padding:16px 18px; color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .aurora-stage.mood-calm{background:linear-gradient(145deg, #0d1730 0%, #16284d 55%, #0f1b33 100%)}
  .aurora-stage.mood-low{background:linear-gradient(145deg, #14122b 0%, #211a42 55%, #12172b 100%)}
  .aurora-stage.mood-empty{background:linear-gradient(145deg, #1b2436 0%, #26334a 100%)}

  .aurora-blobs{position:absolute; inset:-35%; pointer-events:none; filter:blur(42px); opacity:.86; transition:opacity .5s}
  .a-blob{position:absolute; border-radius:50%; mix-blend-mode:screen; transition:background .8s ease, transform .8s ease}
  .a-blob.b1{width:62%; height:72%; left:-6%; top:-12%; background:radial-gradient(circle, var(--au-1, #0866ff) 0%, transparent 70%)}
  .a-blob.b2{width:58%; height:68%; right:-8%; top:8%; background:radial-gradient(circle, var(--au-2, #38bdf8) 0%, transparent 70%)}
  .a-blob.b3{width:52%; height:62%; left:24%; bottom:-18%; background:radial-gradient(circle, var(--au-3, #818cf8) 0%, transparent 70%)}
  @media (prefers-reduced-motion: no-preference){
    .a-blob.b1{animation:auDrift1 11s ease-in-out infinite alternate}
    .a-blob.b2{animation:auDrift2 13s ease-in-out infinite alternate}
    .a-blob.b3{animation:auDrift3 9.5s ease-in-out infinite alternate}
    @keyframes auDrift1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(14%,10%) scale(1.14)}}
    @keyframes auDrift2{0%{transform:translate(0,0) scale(1.06)}100%{transform:translate(-15%,12%) scale(.94)}}
    @keyframes auDrift3{0%{transform:translate(0,0) scale(.96)}100%{transform:translate(8%,-14%) scale(1.12)}}
  }
  .aurora-top{position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between}
  .aurora-pill{font-size:11px; font-weight:600; letter-spacing:.04em; padding:4px 10px; border-radius:999px;
    background:rgba(255,255,255,.13); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.16); color:rgba(255,255,255,.92)}
  .aurora-main{position:relative; z-index:2; display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
  .aurora-val{font:700 40px/1 inherit; letter-spacing:-1.5px; font-variant-numeric:tabular-nums; text-shadow:0 2px 18px rgba(8,102,255,.35)}
  .aurora-lbl{font-size:15px; font-weight:650; margin-top:4px; color:rgba(255,255,255,.95)}
  .aurora-sub{font-size:11.5px; color:rgba(255,255,255,.72)}
  .aurora-pills{position:relative; z-index:2; display:flex; gap:6px; flex-wrap:wrap}
  .au-btn{height:28px; padding:0 11px; font-size:11.5px; font-weight:600; border-radius:999px;
    background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); cursor:pointer; transition:all .18s}
  .au-btn:hover,.au-btn.on{background:rgba(255,255,255,.92); color:#0b152c; filter:none; transform:none}

  .gauge-track{position:relative; height:6px; background:linear-gradient(90deg,#f6d3cd,#e4e6eb 50%,#cfe2ff); border-radius:4px}
  .gauge-track i{position:absolute; top:-4px; width:4px; height:14px; border-radius:2px; background:var(--accent-deep); transform:translateX(-50%); box-shadow:0 1px 4px rgba(8,102,255,.35); transition:left .4s ease}
  .gauge-lbls{display:flex; justify-content:space-between; font-size:11px; color:var(--dim-2); margin-top:6px}
  .emocurve{width:100%; height:auto; display:block; margin:12px 0 4px}
  .mixbar{display:flex; height:8px; border-radius:999px; overflow:hidden; background:var(--paper-deep); margin-top:14px; gap:2px}
  .mixbar i{display:block; height:100%; border-radius:999px}
  .mixlbl{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px}
  .mixlbl span{font-size:11.5px; color:var(--dim); display:flex; align-items:center; gap:5px}
  .mixlbl i{width:8px; height:8px; border-radius:50%; display:inline-block}

  /* =========================================================
     模块三：交互式【记忆漂移星图】（记忆页）
     ========================================================= */
  .starmap-wrap{
    position:relative; height:290px; border-radius:18px; overflow:hidden;
    background:radial-gradient(circle at 50% 48%, #132245 0%, #091124 68%, #060b18 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
    margin-bottom:14px;
  }

    background:rgba(255,255,255,.74); padding:11px 13px; display:flex; flex-direction:column; gap:6px; }
  .sys-task.is-urgent{ border-color:rgba(138,83,0,.28);
    background:linear-gradient(180deg, rgba(253,242,227,.58), rgba(255,255,255,.78)); }
  .sys-task-hd{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .sys-task-title{ font-size:14px; font-weight:650; color:var(--ink); line-height:1.45; flex:1; min-width:160px; }
  .sys-tags{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .sys-task-meta{ display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .sys-task-note{ font-size:12px; color:var(--dim); padding-top:5px; border-top:1px solid var(--hairline); }
  .sys-task-note strong{ color:var(--ink); font-weight:600; }
  /* 审批待办 */
  .sys-apv{ background:rgba(255,255,255,.76); border:1px solid rgba(197,34,31,.16);
    border-radius:var(--r-sm); padding:11px 13px; display:flex; flex-direction:column; gap:5px; }
  .sys-apv-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .sys-apv-action{ font-size:13.5px; font-weight:650; color:var(--err); }
  .sys-apv-target{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px;
    color:var(--ink); background:rgba(29,34,48,.05); padding:4px 8px; border-radius:8px; word-break:break-all; }
  .sys-apv-reason{ font-size:12.5px; color:var(--ink); }
  .sys-apv-foot{ font-size:11.5px; color:var(--dim); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
  /* 记忆曲线 */
  .sys-memsvg{ display:block; width:100%; height:auto; }
  .sys-mem-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    margin-top:6px; padding-top:9px; border-top:1px solid var(--hairline);
    font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
  /* 运行计数 */
  .sys-strip{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  @media (min-width:600px){ .sys-strip{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  @media (min-width:960px){ .sys-strip{ grid-template-columns:repeat(7,minmax(0,1fr)); } }
  .sys-tile{ border:1px solid var(--hairline); border-radius:var(--r); background:rgba(255,255,255,.70);
    padding:11px 12px 10px; display:flex; flex-direction:column; gap:3px; }
  .sys-tile.is-cost{ background:var(--accent-soft); border-color:rgba(8,102,255,.22); grid-column:span 2; }
  @media (min-width:960px){ .sys-tile.is-cost{ grid-column:span 1; } }
  .sys-val{ font:700 20px/1.2 -apple-system,BlinkMacSystemFont,sans-serif; color:var(--ink);
    font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .sys-tile.is-cost .sys-val{ color:var(--accent-deep); }
  .sys-lbl{ font-size:11.5px; color:var(--dim); }
  /* 心跳/情绪摘要条 */
  .sys-pulse{ display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:720px){ .sys-pulse{ grid-template-columns:1fr 1fr; gap:14px; } }
  .sys-mini{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .sys-mini-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .sys-mini-icon{ width:34px; height:34px; border-radius:11px; background:var(--accent-soft);
    display:grid; place-items:center; flex-shrink:0; }
  .sys-mini-main{ font-size:14px; font-weight:650; color:var(--ink); font-variant-numeric:tabular-nums; }
  .sys-mini-sub{ font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .sys-emobar{ display:flex; height:5px; width:92px; border-radius:999px; overflow:hidden;
    background:rgba(29,34,48,.07); gap:1.5px; }
  .sys-emobar i{ display:block; height:100%; border-radius:999px; }
  /* 观察判据 */
  .sys-flags{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:10px; }
  .sys-flag{ border:1px solid var(--hairline); border-radius:var(--r); padding:12px 14px;
    background:rgba(246,247,251,.72); display:flex; flex-direction:column; gap:4px; }
  .sys-flag.is-lit{ background:var(--ok-soft); border-color:rgba(49,162,76,.26); }
  .sys-flag-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sys-flag-name{ font:700 15px/1.3 var(--serif); color:var(--dim); display:flex; align-items:center; gap:7px; }
  .sys-flag.is-lit .sys-flag-name{ color:var(--ink); }
  .sys-flag-desc{ font-size:12.5px; color:var(--dim); line-height:1.5; }
  .sys-flag.is-lit .sys-flag-desc{ color:var(--ink); }
  .sys-flag-state{ font-size:11.5px; color:var(--dim); opacity:.85; }
  .sys-flag.is-lit .sys-flag-state{ color:var(--ok); font-weight:600; opacity:1; }
  /* 空态 */
  .sys-empty{ border:1px dashed var(--hairline); border-radius:var(--r); padding:20px 16px;
    text-align:center; color:var(--dim); font-size:13px; background:rgba(246,247,251,.5); }
  .sys-empty strong{ display:block; font:650 14px/1.4 var(--serif); color:var(--ink); margin-bottom:3px; }
  .sys-empty-inline{ font-size:13px; color:var(--dim); padding:8px 0 2px; }
  .sys-degraded{ border:1px solid rgba(138,83,0,.24); background:var(--warn-soft);
    border-radius:var(--r-sm); padding:9px 13px; font-size:12.5px; color:var(--warn); }
</style>
</head>

    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
    localStorage.setItem('xm.avatar', cv.toDataURL('image/jpeg', 0.85));

<script>
const $ = s => document.querySelector(s);
const log = $('#log'), input = $('#input'), send = $('#send');
let busy = false;
let lastRenderSig = '';

function esc(t){ return String(t||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;'}[c])); }
function addRow(who, text){
  const me = who === 'me';
  const row = document.createElement('div');
  row.className = 'row' + (me ? ' me' : '');
  row.innerHTML = `<div class="bubble">${esc(text)}</div><div class="meta"></div>`;
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row.querySelector('.meta');
}
function chip(meta, text, cls){
  const c = document.createElement('span');
  c.className = 'chip' + (cls ? ' ' + cls : '');
  c.textContent = text;
  meta.appendChild(c);
}
let toastTimer;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- 抽屉与页面路由 ---------- */
const drawer = $('#drawer');
function go(p){
  localStorage.setItem('xm.page', p);
  window.__curPage = p;
  document.querySelectorAll('.page').forEach(s => s.classList.toggle('on', s.id === 'page-' + p));
  document.querySelectorAll('.navitem').forEach(b => b.classList.toggle('on', b.dataset.page === p));
  closeDrawer();
  if(p === 'memory'){ requestAnimationFrame(() => initStarMap()); }
  if(p === 'heartbeat'){ requestAnimationFrame(() => initDualPulse()); }
  /* 系统 · 脉络页：进入即拉聚合接口，并启动页面级 30s 轮询（不可见时只计时不动手） */
  if(p === 'system'){ requestAnimationFrame(() => { refreshSystem(); startSystemTimer(); }); }
}
function openDrawer(){
  drawer.classList.add('open');
  document.body.classList.add('rail-open');
  document.getElementById('menu').setAttribute('aria-expanded', 'true');
}
function closeDrawer(){
  drawer.classList.remove('open');
  document.body.classList.remove('rail-open');
  document.getElementById('menu').setAttribute('aria-expanded', 'false');
}
document.getElementById('menu').onclick = openDrawer;
document.getElementById('scrim').onclick = closeDrawer;
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && document.body.classList.contains('rail-open')) closeDrawer();
});
document.addEventListener('click', e => {
  const b = e.target.closest('.navitem');
  if(b){ go(b.dataset.page); }
});

/* ---------- 设置：API Key ---------- */
let ENV = { configured:false, tail:'', base_url:'', model:'' };

function renderKeyCard(){
  const on = ENV.configured;
  let h = `<div class="card"><h2>API Key<span class="n">${on ? '已配置' : '未配置'}</span></h2>`;
  if(on){
    h += `<div class="muted">当前：<b>····${esc(ENV.tail)}</b>${ENV.model ? ' · ' + esc(ENV.model) : ''}</div>`;
  } else {
    h += `<div class="muted" style="color:var(--err)">还没有填 Key，聊天会失败。</div>`;
  }
  h += `<div class="keybox">
      <input id="k-key" type="password" aria-label="API Key" placeholder="${on ? '要换 Key 就填新的' : '粘贴你的 API Key（sk- 开头）'}" autocomplete="off">
      <input id="k-url" aria-label="接口地址" placeholder="接口地址（留空 = ${esc(ENV.base_url || 'https://api.deepseek.com')}）" value="" autocomplete="off">
      <input id="k-model" aria-label="模型名称" placeholder="模型（留空 = ${esc(ENV.model || 'deepseek-chat')}）" value="" autocomplete="off">
      <div class="btnrow">
        <button id="k-save">保存</button>
        <button id="k-test" class="ghost">测试连接</button>
      </div>
      <div id="k-msg" class="keymsg info" aria-live="polite">保存在本机 <code>.env</code>（明文）。<b>不要把这个文件发给别人。</b></div>
    </div>
    <div class="muted" style="margin-top:8px">「测试连接」会发一次极小的请求，花一点钱。</div>
    </div>`;
  return h;
}
function keyMsg(text, cls){
  const el = document.getElementById('k-msg');
  if(!el) return;
  el.className = 'keymsg ' + (cls || 'info');
  el.innerHTML = text;
}
async function loadEnv(){
  try{
    const r = await fetch('/api/env');
    const d = await r.json();
    if(d.ok){ ENV = d.env || ENV; }
  }catch(e){}
}
async function saveKey(){
  const key = (document.getElementById('k-key').value || '').trim();
  const url = (document.getElementById('k-url').value || '').trim();
  const model = (document.getElementById('k-model').value || '').trim();
  const updates = {};
  if(key) updates.LLM_API_KEY = key;
  if(url) updates.LLM_BASE_URL = url;
  if(model) updates.LLM_MODEL = model;
  if(!Object.keys(updates).length){ keyMsg('什么都没填，要改哪一项就填哪一项。', 'bad'); return; }
  const btn = document.getElementById('k-save');
  btn.disabled = true; keyMsg('保存中…', 'info');
  try{
    const r = await fetch('/api/env', {
      method:'POST', headers:{'Content-Type':'application/json','X-Xiaoman-Request':'1'},
      body: JSON.stringify({updates})
    });
    const d = await r.json();
    if(!d.ok){ keyMsg('保存失败：' + esc(d.error || '未知错误'), 'bad'); return; }
    ENV = d.env || ENV;
    document.getElementById('k-key').value = '';
    document.getElementById('k-url').value = '';
    document.getElementById('k-model').value = '';
    let msg = '已保存：' + esc((d.saved||[]).join('、')) + '。';
    if(ENV.tail) msg += ` 当前 Key：····${esc(ENV.tail)}`;
    if((d.errors||[]).length) msg += '<br>部分未保存：' + esc(d.errors.join('；'));
    if(key && !/^sk-/.test(key)) msg += '<br><span style="color:var(--warn)">它不像 sk- 开头的 Key，聊天失败的话先检查它。</span>';
    keyMsg(msg, 'ok');
    await refreshStatus(true);
  }catch(e){
    keyMsg('连不上后端：' + esc(e.message), 'bad');
  }finally{ btn.disabled = false; }
}
async function testKey(){
  const key = (document.getElementById('k-key').value || '').trim();
  const btn = document.getElementById('k-test');
  btn.disabled = true;
  keyMsg('正在测……<b>这会花一点点钱</b>（一次极小的请求）。', 'info');
  try{
    const r = await fetch('/api/env/test', {
      method:'POST', headers:{'Content-Type':'application/json','X-Xiaoman-Request':'1'},
      body: JSON.stringify(key ? {key} : {})
    });
    const d = await r.json();
    if(d.ok){
      keyMsg(`连上了。模型 <b>${esc(d.model||'')}</b>，用了 ${d.latency_ms ?? '?'} ms，它回了「${esc(d.reply||'')}」。`, 'ok');
    } else { keyMsg('没连上：' + esc(d.error || '未知错误'), 'bad'); }
  }catch(e){
    keyMsg('连不上后端：' + esc(e.message), 'bad');
  }finally{ btn.disabled = false; }
}

/* =========================================================
   可视化引擎 1：Apple Fitness 风格【同心共生环】
   ========================================================= */
let activeRingIdx = -1;
function buildConcentricRings(rel){
  const dims = [
    { key:'trust',       name:'信任', desc:'深度托付', val: Number(rel.trust ?? 0),       r:88, c1:'#0ea5a0', c2:'#34d3bf' },
    { key:'closeness',   name:'亲近', desc:'情感距离', val: Number(rel.closeness ?? 0),   r:69, c1:'#f26d85', c2:'#f9a8b8' },
    { key:'familiarity', name:'熟悉', desc:'语境默契', val: Number(rel.familiarity ?? 0), r:50, c1:'#8b7cf6', c2:'#b3a7fb' },
    { key:'boundaries',  name:'稳固', desc:'边界共识', val: Number(rel.boundaries ?? 0),  r:31, c1:'#f6b73d', c2:'#fcd34d' }
  ];
  window.__ringDims = dims;
  window.__ringStage = rel.stage || '初识';
  const avgPct = Math.round(dims.reduce((s,d)=>s + Math.min(1, d.val/5), 0) / dims.length * 100);
  window.__ringAvg = avgPct;

  const defs = dims.map((d,i) => `
    <linearGradient id="rg${i}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${d.c1}"/><stop offset="100%" stop-color="${d.c2}"/>
    </linearGradient>`).join('');

  const tracks = dims.map((d,i) => `<circle class="ring-track" cx="110" cy="110" r="${d.r}" stroke="${d.c1}"/>`).join('');
  const fills = dims.map((d,i) => {
    const circ = 2 * Math.PI * d.r;
    const pct = Math.max(0.04, Math.min(1, d.val / 5));
    const offset = circ * (1 - pct);
    return `<circle class="ring-fill" data-ri="${i}" cx="110" cy="110" r="${d.r}" stroke="url(#rg${i})"
      stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
      onclick="focusRing(${i})" />`;
  }).join('');

  const conflictVal = Number(rel.conflict ?? 0);
  const legend = dims.map((d,i) => `
    <button class="r-row" data-ri="${i}" onclick="focusRing(${i})">
      <span class="r-dot" style="background:linear-gradient(135deg,${d.c1},${d.c2})"></span>
      <span class="r-name">${d.name}</span>
      <span class="r-desc">${d.desc}</span>
      <span class="r-val">${d.val.toFixed(1)} <span style="font-weight:500;color:var(--dim-2);font-size:11px">/ 5</span></span>
    </button>`).join('') + `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 12px;font-size:12px;color:var(--dim)">
      <span>摩擦指数 · 越低越平稳</span>
      <b style="color:${conflictVal>=3?'var(--warn)':'var(--ink)'};font-variant-numeric:tabular-nums">${conflictVal.toFixed(1)} / 5</b>
    </div>`;

  return `
    <div class="rings-layout">
      <div class="rings-stage">
        <svg class="rings-svg" viewBox="0 0 220 220" role="img" aria-label="共生同心环">${defs ? '<defs>'+defs+'</defs>' : ''}${tracks}${fills}</svg>
        <div class="rings-center" id="ring-center">

function emoCurve(days){
  if(!days.length) return '';
  const W=320, H=114, top=14, bot=94;
  const x = i => days.length === 1 ? W/2 : 12 + i*(W-24)/(days.length-1);
  const y = v => top + (1-(Math.max(-1,Math.min(1,v))+1)/2)*(bot-top);
  const pts = days.map((p,i) => [x(i), y(p.v)]);

  let dPath = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0; i<pts.length-1; i++){
    const [x0,y0] = pts[i], [x1,y1] = pts[i+1];
    const cx = ((x0 + x1) / 2).toFixed(1);
    dPath += ` C ${cx},${y0.toFixed(1)} ${cx},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  const areaPath = `${dPath} L ${pts[pts.length-1][0].toFixed(1)},${bot} L ${pts[0][0].toFixed(1)},${bot} Z`;
  const zeroY = ((top + bot) / 2).toFixed(1);
  const dots = pts.map(([px,py]) => `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.2" fill="#ffffff" stroke="#0866ff" stroke-width="2"/>`).join('');
  const mid = Math.floor((days.length-1)/2);
  let labels = `<text x="12" y="${H-2}" font-size="10" fill="#8a8d91">${esc(days[0].d)}</text>`;
  if(days.length > 2) labels += `<text x="${x(mid).toFixed(1)}" y="${H-2}" text-anchor="middle" font-size="10" fill="#8a8d91">${esc(days[mid].d)}</text>`;
  if(days.length > 1) labels += `<text x="${W-12}" y="${H-2}" text-anchor="end" font-size="10" fill="#8a8d91">${esc(days[days.length-1].d)}</text>`;

  return `<svg class="emocurve" viewBox="0 0 ${W} ${H}" role="img" aria-label="近${days.length}天情绪走向">
    <defs>
      <linearGradient id="emoGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0866ff" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#0866ff" stop-opacity="0.0"/>
      </linearGradient>
    </defs>
    <line x1="12" y1="${zeroY}" x2="${W-12}" y2="${zeroY}" stroke="#e2e6ef" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="${areaPath}" fill="url(#emoGrad)"/>
    <path d="${dPath}" fill="none" stroke="#0866ff" stroke-width="2.2" stroke-linecap="round"/>
    ${dots}${labels}
  </svg>`;
}

/* =========================================================
   可视化引擎 3：原生 Canvas【记忆漂移星图】
   ========================================================= */
let starRAF = null;
let starNodes = [];
let starSelected = 0;
let starSeed = 1;

function buildStarData(st){
  const explicit = (st && st.memories) || [];
  const rawItems = ((st && st.memory) || {}).items || [];
  const out = [];
  explicit.forEach((m, idx) => {
    const wMatch = String(m.weight || '0.85').match(/[\d.]+/);
    const w = wMatch ? Math.min(1, Math.max(0.35, parseFloat(wMatch[0]))) : 0.85;
    out.push({
      kind: 'drift',
      id: m.id || ('MEM-' + String(idx+1).padStart(3,'0')),
      cat: m.cat || '漂移锚点',
      weight: w,
      weightLabel: m.weight || ('权重 ' + w.toFixed(2)),
      angle: m.angle || (11.5 + (idx * 7.3) % 24).toFixed(1) + '°',
      origin: m.origin || '',
      drifted: m.drifted || '',
      driftedSafeHtml: !!m.drifted_html
    });
  });
  rawItems.forEach((it, idx) => {
    if(out.length >= 16) return;
    const w = Math.max(0.42, 0.92 - idx * 0.045);
    out.push({
      kind: 'core',
      id: 'MEM-' + String(out.length + 1).padStart(3, '0'),
      cat: it.cat || '长期记忆',
      weight: w,
      weightLabel: '留存 ' + Math.round(w * 100) + '%',
      angle: (8.2 + (idx * 5.7) % 19).toFixed(1) + '°',
      origin: '对话沉淀 · ' + (it.cat || '日常语境'),
      drifted: it.text || '',
      driftedSafeHtml: false
    });
  });
  return out;
}

function updateStarInspector(){
  const box = document.getElementById('star-inspector');
  if(!box || !starNodes.length) return;
  const n = starNodes[starSelected] || starNodes[0];
  const driftedContent = n.driftedSafeHtml ? n.drifted : esc(n.drifted);
  box.innerHTML = `
    <div class="star-insp-head">
      <span class="star-insp-id">${esc(n.id)}</span>
      <span class="tag on">${esc(n.cat)}</span>
      <span class="drift-badge">偏转角 ${esc(n.angle)} · ${esc(n.weightLabel)}</span>
    </div>
    <div class="drift-compare">
      <div class="drift-box"><div class="drift-box-title">原始输入锚点 (Origin)</div>${esc(n.origin)}</div>
      <div class="drift-arrow">→</div>
      <div class="drift-box after"><div class="drift-box-title">演化漂移态 (Drifted)</div>${driftedContent}</div>
    </div>`;
}

function rearrangeStarMap(){
  starSeed += 1;
  starNodes.forEach((n, i) => {
    const a = (i / Math.max(1, starNodes.length)) * Math.PI * 2 + starSeed * 1.15;
    const r = 0.22 + ((i * 37 + starSeed * 19) % 100) / 100 * 0.22;
    n.tx = 0.5 + Math.cos(a) * r * 1.35;
    n.ty = 0.5 + Math.sin(a) * r * 0.85;
  });
  toast('已触发记忆突触演化重排');
}

function initStarMap(){
  if(starRAF){ cancelAnimationFrame(starRAF); starRAF = null; }
  const cv = document.getElementById('star-canvas');
  if(!cv) return;
  const rect = cv.parentElement.getBoundingClientRect();
  if(rect.width < 10 || rect.height < 10) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(rect.width * dpr);
  cv.height = Math.round(rect.height * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const W = rect.width, H = rect.height;
  const data = buildStarData(window.__st);
  if(starSelected >= data.length) starSelected = 0;

  starNodes = data.map((d, i) => {
    const baseAngle = (i / Math.max(1, data.length)) * Math.PI * 2 + 0.55;
    const radius = 0.2 + (i % 3) * 0.095;
    const ox = 0.5 + Math.cos(baseAngle - 0.24) * (radius * 0.72) * 1.3;
    const oy = 0.5 + Math.sin(baseAngle - 0.24) * (radius * 0.72) * 0.85;
    const x = 0.5 + Math.cos(baseAngle) * radius * 1.35;
    const y = 0.5 + Math.sin(baseAngle) * radius * 0.85;
    return { ...d, ox, oy, x, y, tx:x, ty:y, phase: i * 0.9 };
  });

  updateStarInspector();

  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function pickNode(clientX, clientY){
    const r = cv.getBoundingClientRect();
    const px = clientX - r.left, py = clientY - r.top;
    let best = -1, bestDist = 30;
    starNodes.forEach((n, i) => {
      const dx = n.x * W - px, dy = n.y * H - py;
      const dist = Math.hypot(dx, dy);
      if(dist < bestDist){ bestDist = dist; best = i; }
    });
    if(best !== -1){
      starSelected = best;
      updateStarInspector();
      if(reduced) draw(0);
    }
  }
  cv.onclick = e => pickNode(e.clientX, e.clientY);

  function draw(t){
    ctx.clearRect(0, 0, W, H);
    const cx = W * 0.5, cy = H * 0.5;

    // 空间轨道参考环
    [0.18, 0.31, 0.44].forEach(k => {
      ctx.beginPath();
      ctx.ellipse(cx, cy, W * k * 0.88, H * k * 0.92, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(29, 34, 48, 0.09)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    // 平滑趋近目标位置 + 呼吸微漂移
    starNodes.forEach(n => {
      n.x += (n.tx - n.x) * 0.08;
      n.y += (n.ty - n.y) * 0.08;
    });

    // 突触连线
    for(let i=0; i<starNodes.length; i++){
      for(let j=i+1; j<starNodes.length; j++){
        const a = starNodes[i], b = starNodes[j];
        const dist = Math.hypot((a.x-b.x)*W, (a.y-b.y)*H);
        if(dist < Math.min(W, H) * 0.44){
          const alpha = (1 - dist / (Math.min(W, H) * 0.44)) * 0.24;
          ctx.beginPath();
          ctx.moveTo(a.x * W, a.y * H);
          ctx.lineTo(b.x * W, b.y * H);
          ctx.strokeStyle = (i===starSelected || j===starSelected)
            ? `rgba(20, 184, 166, ${Math.min(0.75, alpha * 2.4)})`
            : `rgba(139, 124, 246, ${alpha * 0.9})`;
          ctx.lineWidth = (i===starSelected || j===starSelected) ? 1.4 : 0.9;
          ctx.stroke();
        }
      }
    }

    // 选中节点的原始锚点 -> 当前漂移向量轨迹
    if(starNodes[starSelected]){
      const s = starNodes[starSelected];
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(s.ox * W, s.oy * H);
      ctx.lineTo(s.x * W, s.y * H);
      ctx.strokeStyle = 'rgba(139, 124, 246, 0.72)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.restore();
      ctx.beginPath();
      ctx.arc(s.ox * W, s.oy * H, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(29, 34, 48, 0.35)';
      ctx.fill();
    }

    // 绘制记忆星辰节点
    starNodes.forEach((n, i) => {
      const floatY = reduced ? 0 : Math.sin(t * 0.0014 + n.phase) * 2.6;
      const nx = n.x * W, ny = n.y * H + floatY;
      const isSel = i === starSelected;
      const baseR = 4.2 + n.weight * 3.8;

      // 发光光晕
      const col = n.kind === 'drift' ? '139, 124, 246' : '20, 184, 166';
      const g = ctx.createRadialGradient(nx, ny, 0, nx, ny, isSel ? baseR * 3.6 : baseR * 2.2);
      g.addColorStop(0, isSel ? 'rgba(20, 184, 166, 0.5)' : `rgba(${col}, 0.34)`);
      g.addColorStop(1, `rgba(${col}, 0)`);
      ctx.beginPath();
      ctx.arc(nx, ny, isSel ? baseR * 3.6 : baseR * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();

      // 节点核心
      ctx.beginPath();
      ctx.arc(nx, ny, isSel ? baseR + 1.2 : baseR, 0, Math.PI * 2);
      ctx.fillStyle = isSel ? '#ffffff' : (n.kind === 'drift' ? '#6d5bd8' : '#0c9b8a');
      ctx.fill();

      if(isSel){
        ctx.beginPath();
        ctx.arc(nx, ny, baseR + 5.5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(13, 148, 136, 0.6)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      // 节点编号微标签
      ctx.font = '600 10px -apple-system, sans-serif';
      ctx.fillStyle = isSel ? 'rgba(29,34,48,0.92)' : 'rgba(29,34,48,0.45)';
      ctx.textAlign = 'center';
      ctx.fillText(n.id, nx, ny + baseR + 13);
    });

    if(!reduced) starRAF = requestAnimationFrame(draw);
  }
  draw(0);
}
window.addEventListener('resize', () => {
  if(document.getElementById('page-memory').classList.contains('on')) initStarMap();
  if(document.getElementById('page-heartbeat').classList.contains('on')) initDualPulse();

/* =========================================================
   可视化引擎 4：原生 Canvas【双通道实时双生心跳波形】
   ========================================================= */
let pulseRAF = null;
let pulseBoost = 0;       // 0 ~ 1 共振脉冲强度（触发时拉满并自然衰减）
let pulseSyncRate = 86;   // 实时双生同频度百分比

function triggerResonance(silent){
  pulseBoost = 1.0;
  const orb = document.getElementById('breath-orb');
  if(orb){
    orb.classList.add('ping');
    setTimeout(() => orb.classList.remove('ping'), 460);
  }
  if(!silent) toast('已发送共振脉冲 · 双生波形正在同频收敛');
}

function initDualPulse(){
  if(pulseRAF){ cancelAnimationFrame(pulseRAF); pulseRAF = null; }
  const cv = document.getElementById('pulse-canvas');
  if(!cv) return;
  const rect = cv.parentElement.getBoundingClientRect();
  if(rect.width < 10 || rect.height < 10) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(rect.width * dpr);
  cv.height = Math.round(rect.height * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const W = rect.width, H = rect.height;
  const midY = H * 0.5;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function ecgSpike(u){
    // 柔和心电 QRS 脉冲包络（u 为 0~1 相位）
    const p = ((u % 1) + 1) % 1;
    const g1 = Math.exp(-Math.pow((p - 0.36) / 0.022, 2)) * 1.0;
    const g2 = -Math.exp(-Math.pow((p - 0.395) / 0.016, 2)) * 0.45;
    const g3 = Math.exp(-Math.pow((p - 0.52) / 0.048, 2)) * 0.24;
    return g1 + g2 + g3;
  }

  function drawWave(t){
    ctx.clearRect(0, 0, W, H);

    // 缓慢衰减共振脉冲
    if(pulseBoost > 0.002) pulseBoost *= 0.984;
    else pulseBoost = 0;

    // 实时同步率 HUD 更新
    const targetSync = Math.round(86 + pulseBoost * 13);
    if(targetSync !== pulseSyncRate){
      pulseSyncRate = targetSync;
      const pill = document.getElementById('hb-sync-pill');
      if(pill) pill.textContent = `双生同频度 ${pulseSyncRate}%`;
    }

    // 极简水平参考基准线
    ctx.beginPath();
    ctx.moveTo(0, midY);
    ctx.lineTo(W, midY);
    ctx.strokeStyle = 'rgba(148, 185, 255, 0.14)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    const speed = t * 0.0011;
    // 相位差：平时偏移 0.18，触发共振脉冲时向 0 收敛实现同频重叠
    const phaseDiff = 0.18 * (1 - pulseBoost * 0.92);
    const ampA = (16 + pulseBoost * 11) * (H / 116);
    const ampB = (13 + pulseBoost * 13) * (H / 116);

    // 通道 B（你 · 交互节律：冰白/淡紫）
    ctx.save();
    ctx.beginPath();
    for(let x=0; x<=W; x+=2){
      const nx = x / W;
      const env = Math.sin(nx * Math.PI); // 两端柔和渐隐
      const wave = Math.sin(nx * Math.PI * 4 - speed * 2.1 + phaseDiff * Math.PI * 2) * 0.35
                 + ecgSpike(nx * 1.45 - speed * 0.34 + phaseDiff) * 0.95;
      const y = midY - wave * ampB * (0.28 + 0.72 * env);
      if(x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = pulseBoost > 0.2 ? 'rgba(204, 251, 241, 0.92)' : 'rgba(45, 212, 191, 0.72)';
    ctx.lineWidth = 1.8 + pulseBoost * 0.7;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(45, 212, 191, 0.45)';
    ctx.shadowBlur = 8 + pulseBoost * 8;
    ctx.stroke();
    ctx.restore();

    // 通道 A（鹤辞 · 自主节律：Meta 蓝 -> 天青发光波形）
    ctx.save();
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, '#f26d85');
    grad.addColorStop(0.5, '#f47f9a');
    grad.addColorStop(1, '#f9a8b8');
    ctx.beginPath();
    for(let x=0; x<=W; x+=2){
      const nx = x / W;
      const env = Math.sin(nx * Math.PI);
      const wave = Math.sin(nx * Math.PI * 4 - speed * 2.1) * 0.38
                 + ecgSpike(nx * 1.45 - speed * 0.34) * 1.05;
      const y = midY - wave * ampA * (0.28 + 0.72 * env);
      if(x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.4 + pulseBoost * 0.8;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(242, 109, 133, 0.6)';
    ctx.shadowBlur = 10 + pulseBoost * 10;
    ctx.stroke();
    ctx.restore();

    if(!reduced && document.getElementById('page-heartbeat').classList.contains('on')){
      pulseRAF = requestAnimationFrame(drawWave);
    }
  }
  drawWave(0);
}

    c += buildConcentricRings(rel);

  const um = st.user_model || {};

    let c = `<div class="card"><h2>她眼中的你<span class="n">${um.active||0} 条</span></h2>`;

/* ---------- 图片压缩上传 ---------- */
let IMG = null;
function pvRender(){
  const box = $('#preview');
  if(!IMG){ box.classList.add('hide'); return; }
  box.classList.remove('hide');
  $('#pvimg').src = IMG.url;
  $('#pvsize').textContent = Math.round(IMG.bytes/1024) + ' KB';
  send.disabled = busy || (!input.value.trim() && !IMG);
}
function pvClear(){ if(IMG){ URL.revokeObjectURL(IMG.url); IMG = null; } pvRender(); }
const MAX_EDGE = 1600, MAX_UPLOAD = 680 * 1024;

async function shrink(file){
  if(file.size <= MAX_UPLOAD && /png|jpeg|webp|gif|bmp/.test(file.type)) return file;
  const bmp = await createImageBitmap(file);
  let { width:w, height:h } = bmp;
  const scale = Math.min(1, MAX_EDGE / Math.max(w, h));
  w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  bmp.close && bmp.close();
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
  if(!blob) throw new Error('缩放失败');
  return new File([blob], 'scaled.jpg', { type:'image/jpeg' });
}

async function acceptFile(file){
  if(!file) return;
  if(!/^image\//.test(file.type || '')){ alert('只能发图片（PNG / JPEG / GIF / WebP / BMP）'); return; }
  try{
    const small = await shrink(file);
    if(small.size > MAX_UPLOAD * 1.5){ alert(`图还是太大（${Math.round(small.size/1024)} KB），换张小一点的吧`); return; }
    const buf = await small.arrayBuffer();
    let bin = ''; const u8 = new Uint8Array(buf);
    for(let i=0;i<u8.length;i+=0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000));
    const b64 = btoa(bin);
    pvClear();
    IMG = { name:null, url: URL.createObjectURL(small), bytes: small.size };
    pvRender();
    $('#pvname').textContent = '上传中…';
    const r = await fetch('/api/upload', {
      method:'POST', headers:{'Content-Type':'application/json','X-Xiaoman-Request':'1'},
      body: JSON.stringify({data: b64})
    });
    const d = await r.json();
    if(!d.ok){ pvClear(); alert('上传失败：' + (d.error || '未知错误')); return; }
    IMG.name = d.image.name; IMG.bytes = d.image.bytes;
    $('#pvname').textContent = d.image.existed ? '这张之前存过' : '已就绪';
    $('#pvsize').textContent = Math.round(d.image.bytes/1024) + ' KB';
  }catch(e){ pvClear(); alert('处理图片出错：' + e.message); }
}

$('#pick').onclick = () => $('#file').click();
$('#file').onchange = e => { acceptFile(e.target.files[0]); e.target.value = ''; };
$('#pvdel').onclick = pvClear;
input.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(x => /^image\//.test(x.type));
  if(it){ e.preventDefault(); acceptFile(it.getAsFile()); }
});
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  if([...(e.dataTransfer?.types||[])].includes('Files')){ e.preventDefault(); document.body.classList.add('dropping'); }
}));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  if(ev === 'drop'){ if(e.dataTransfer?.files?.[0]){ e.preventDefault(); acceptFile(e.dataTransfer.files[0]); } }
  document.body.classList.remove('dropping');
}));

async function sendText(resend){
  let text, imgName, imgUrl, skipUserRow = false;
  if(resend){
    text = resend.text; imgName = resend.image; imgUrl = resend.url; skipUserRow = true;
  } else {
    text = input.value.trim();
    if((!text && !IMG) || busy) return;
    if(IMG && !IMG.name){ toast('图片还在上传，稍等一下'); return; }
    if(IMG){ imgName = IMG.name; imgUrl = IMG.url; }
  }
  if(busy) return;
  busy = true; send.disabled = true;
  const shown = text || '（发了张图）';
  if(!skipUserRow){
    input.value = ''; input.style.height = 'auto';
    localStorage.removeItem('xm.draft');
  }
  const meMeta = skipUserRow ? null : addRow('me', shown);
  if(!skipUserRow && imgUrl){
    const im = document.createElement('img');
    im.src = imgUrl; im.className = 'sentimg';
    meMeta.parentElement.querySelector('.bubble').prepend(im);
  }
  if(!skipUserRow){ IMG = null; pvRender(); }

  const meta = addRow('her', '');
  meta.innerHTML = '<span class="spin"></span> 正在想…';

  try{
    const r = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json','X-Xiaoman-Request':'1'},
      body: JSON.stringify({text: text, image: imgName})
    });
    const d = await r.json();
    if(!d.ok){ meta.closest('.row').remove(); throw new Error(d.error || '未知错误'); }
    meta.parentElement.querySelector('.bubble').textContent = d.reply || '（空回复）';
    meta.innerHTML = '';
    (d.tool_calls||[]).forEach(c => {
      const bad = !c.ok;
      chip(meta, `${c.name}${c.ok ? '' : ' · 被拒'}`, c.repeat ? 'warn' : (bad ? 'deny' : 'ok'));
    });
    if(d.tool_iterations > 1) chip(meta, `多步 ×${d.tool_iterations}`);
    if(d.tool_truncated) chip(meta, '工具循环被截断', 'warn');
    if(d.memory_hits) chip(meta, `记起了 ${d.memory_hits} 条`);
    (d.relationship_events||[]).forEach(t => chip(meta, `关系 · ${t}`));
    (d.user_model_changes||[]).forEach(c => chip(meta, c.type === 'revise' ? '修正了一条判断' : '记下一条判断'));
    if(d.cost_yuan) chip(meta, `${d.cost_yuan.toFixed(6)} 元`);
    triggerResonance(true);
    if(d.status) renderStatus(d.status);
  }catch(e){
    meta.closest('.row').remove();
    input.value = text; input.style.height = 'auto';
    localStorage.setItem('xm.draft', text);
    const human = /Failed to fetch|NetworkError|load failed/i.test(e.message)
      ? '连不上后端——核心服务可能没在运行。' : '出错了：' + e.message;
    const erow = document.createElement('div'); erow.className = 'err-row';
    const ebox = document.createElement('div'); ebox.className = 'err'; ebox.textContent = human;
    const rb = document.createElement('button'); rb.className = 'retry'; rb.textContent = '重试';
    rb.onclick = () => { erow.remove(); sendText({ text: text, image: imgName, url: imgUrl }); };
    erow.appendChild(ebox); erow.appendChild(rb);
    log.appendChild(erow);
  }finally{
    busy = false;
    send.disabled = busy || (!input.value.trim() && !IMG);
    input.focus();
    log.scrollTop = log.scrollHeight;
  }
}

send.onclick = () => sendText();
input.addEventListener('keydown', e => {
  if(e.isComposing || e.keyCode === 229) return;
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(180, input.scrollHeight) + 'px';

  localStorage.setItem('xm.draft', input.value);
});

document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('.apv-btn');
  if (!btn) return;
  btn.disabled = true;
  try {
    const r = await fetch('/api/approvals/decide', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Xiaoman-Request': '1'},
      body: JSON.stringify({approval_id: btn.dataset.aid, decision: btn.dataset.dec})
    });
    const d = await r.json().catch(() => ({}));
    if(d && d.ok === false){ toast('操作没成功，稍后它会重新出现。'); }

  } catch(e) { toast('操作没成功，稍后它会重新出现。'); }

/* ---------- 系统 · 脉络页（2026-11-21，v1.1 设计稿落地；席位/池单/徽章全部数据驱动可增） ---------- */
const SEAT_NAMES = { /* 显示名映射,可配置;未登记席位回退原始 id */
  'heci_001': '鹤辞本体',
  'heci_001_dsh': '本地执行席',
  'heci_001_muse': '云端 Muse 席',
  'heci_001_zcode': 'ZCode 开发席',
};
const FLAG_META = {
  segment_distilled: {name: '按条蒸馏', desc: '分段蒸馏首次真实触发'},
  provisional: {name: '发展闭环', desc: '人格出现 provisional 过渡态'},
  emotion_days: {name: '情绪历史', desc: '情绪快照积累到可画曲线'},
};
let SYS = null;
let SYS_TIMER = null;

function sysName(id){ return SEAT_NAMES[id] || id; }
function fmtN(n){
  n = Number(n) || 0;
  if(n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if(n >= 1e4) return (n/1e3).toFixed(1) + 'k';
  return String(n);
}
function fmtCost(y){ return '¥ ' + (Number(y) || 0).toFixed(2); }
function fmtIdle(s){
  if(s < 90) return Math.round(s) + 's';
  if(s < 3600) return Math.round(s/60) + ' 分钟';
  if(s < 86400) return Math.round(s/3600) + ' 小时';
  return Math.round(s/86400) + ' 天';
}
function when(iso){ return esc((iso || '').slice(5,16).replace('T',' ')); }
function minsLeft(iso){
  if(!iso) return null;
  const t = new Date(iso).getTime();
  return isNaN(t) ? null : Math.round((t - Date.now()) / 60000);
}

/* 席位拓扑：1~6 单环；7~12 双环；>12 取最近活跃 12 席 + "+K"。核心本体居中。 */
function topoSVG(insts){
  const core = insts.find(i => !i.environment) || null;
  let seats = insts.filter(i => i.environment);
  let extra = 0;
  if(seats.length > 12){
    const sorted = seats.slice().sort((a,b) =>
      (b.last_seen_at||'').localeCompare(a.last_seen_at||''));
    extra = seats.length - 12;
    seats = sorted.slice(0, 12);
  }
  const CX = 260, CY = 120;
  const n = seats.length;
  const ring1 = n <= 8 ? seats : seats.slice(0, Math.ceil(n/2));
  const ring2 = n <= 8 ? [] : seats.slice(Math.ceil(n/2));
  const pos = (ring, rx, ry, off) => ring.map((s, i) => {
    const ang = -Math.PI/2 + off + i * 2*Math.PI / ring.length;
    return {s, x: CX + rx*Math.cos(ang), y: CY + ry*Math.sin(ang)};
  });
  const pts = [...pos(ring1, 128, 66, 0), ...pos(ring2, 186, 96, 0.35)];
  let svg = `<svg viewBox="0 0 520 240" role="img" aria-label="席位脉络图">`;
  svg += `<ellipse cx="${CX}" cy="${CY}" rx="128" ry="66" fill="none" stroke="rgba(29,34,48,.07)" stroke-dasharray="3 4"/>`;
  if(ring2.length) svg += `<ellipse cx="${CX}" cy="${CY}" rx="186" ry="96" fill="none" stroke="rgba(29,34,48,.05)"/>`;
  for(const p of pts){
    const on = !!p.s.online;
    svg += `<line x1="${CX}" y1="${CY}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="${on ? '#0866ff' : '#5f6266'}" stroke-opacity="${on ? .3 : .15}" ${on ? 'stroke-width="1.4"' : 'stroke-dasharray="3 4"'}/>`;
  }
  for(const p of pts){
    const on = !!p.s.online;
    const idle = Number(p.s.idle_seconds) || 0;
    const fill = on ? '#e7f6ec' : 'rgba(95,98,102,.08)';
    const ring = on ? 'rgba(49,162,76,.28)' : 'rgba(29,34,48,.12)';
    const dot = on ? '#31a24c' : '#9aa0a6';
    const state = on ? '活跃中' : '走了 ' + fmtIdle(idle);
    const col = on ? '#1c1e21' : '#5f6266';
    svg += `<g transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})">` +
      `<circle r="${on ? 14 : 13}" fill="${fill}" stroke="${ring}" ${on ? '' : 'stroke-dasharray="3 2"'}/>` +
      `<circle r="${on ? 5 : 4.2}" fill="${dot}"/>` +
      `<text y="25" text-anchor="middle" font-size="11" font-weight="${on ? 600 : 500}" fill="${col}">${esc(sysName(p.s.instance_id))}</text>` +
      `<text y="38" text-anchor="middle" font-size="9.5" fill="${col}">${state}</text></g>`;
  }
  if(core){
    const on = !!core.online;
    svg += `<g transform="translate(${CX},${CY})">` +
      `<circle r="30" fill="#e7f0ff" opacity=".72"/>` +
      `<circle r="21" fill="#ffffff" stroke="#0866ff" stroke-width="1.8" opacity="${on ? 1 : .5}"/>` +
      `<circle cx="14" cy="-14" r="4.5" fill="${on ? '#31a24c' : '#9aa0a6'}" stroke="#fff" stroke-width="1.6"/>` +
      `<text y="4" text-anchor="middle" font-size="12.5" font-weight="700" font-family="&quot;Noto Serif SC&quot;,&quot;Songti SC&quot;,serif" fill="#0356c9">${esc(sysName(core.instance_id))}</text>` +
      `<text y="40" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0356c9">核心本体 · ${on ? '在线' : '离线'}</text></g>`;
  } else {
    svg += `<text x="${CX}" y="${CY+4}" text-anchor="middle" font-size="11.5" fill="#5f6266">未检测到已登记的席位</text>`;
  }
  if(extra) svg += `<text x="508" y="16" text-anchor="end" font-size="10.5" fill="#5f6266">+${extra} 席</text>`;
  svg += `</svg>`;
  return svg;
}

function memCurveSVG(hist){
  if(!hist || hist.length < 2){
    return `<svg viewBox="0 0 640 150" role="img"><line x1="46" y1="75" x2="618" y2="75" stroke="rgba(29,34,48,.11)"/>` +
      `<text x="332" y="80" text-anchor="middle" font-size="12" fill="#5f6266">还没有形成记忆版本链——对话积累后会自动整理</text></svg>`;
  }
  const L = 46, R = 618, T = 30, B = 174;
  const vals = hist.map(h => Number(h.items) || 0);
  const vmax = Math.max(...vals), vmin = Math.min(...vals, 0);
  const span = (vmax - vmin) || 1;
  const y = v => B - (v - vmin) / span * (B - T);
  const x = i => L + i * (R - L) / (hist.length - 1);
  let g = '';
  for(let k = 1; k <= 3; k++){
    const v = Math.round(vmin + span * k / 4);
    g += `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${R}" y2="${y(v).toFixed(1)}" stroke="rgba(29,34,48,.07)" stroke-dasharray="3 3"/><text x="${L-8}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#5f6266">${v}</text>`;
  }
  let pts = '', area = `${L},${B}`;
  hist.forEach((h, i) => {
    const px = x(i).toFixed(1), py = y(Number(h.items)||0).toFixed(1);
    pts += `${px},${py} `;
    area += ` ${px},${py}`;
  });
  area += ` ${R},${B}`;
  let dots = '';
  hist.forEach((h, i) => {
    if(i % 5 === 0 || i === hist.length - 1){
      dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(Number(h.items)||0).toFixed(1)}" r="2.6" fill="#fff" stroke="#0866ff" stroke-width="1.6"/>`;
    }
  });
  const last = hist[hist.length-1], lx = x(hist.length-1), ly = y(Number(last.items)||0);
  const xlab = (i, anchor) => `<text x="${x(i).toFixed(1)}" y="198" text-anchor="${anchor}" font-size="10" fill="#5f6266">${esc(hist[i].version)}</text>`;
  return `<svg viewBox="0 0 640 210" role="img" aria-label="记忆增长曲线">` +
    `<defs><linearGradient id="sysMemGrad" x1="0" y1="0" x2="0" y2="1">` +
    `<stop offset="0%" stop-color="#0866ff" stop-opacity=".14"/><stop offset="100%" stop-color="#0866ff" stop-opacity="0"/></linearGradient></defs>` +
    g + `<line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="rgba(29,34,48,.12)"/>` +
    `<polygon points="${area}" fill="url(#sysMemGrad)"/>` +
    `<polyline points="${pts}" fill="none" stroke="#0866ff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` +
    dots +
    `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="10" fill="#0866ff" opacity=".12"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.2" fill="#fff" stroke="#0866ff" stroke-width="2.2"/>` +
    `<g transform="translate(${Math.min(lx-92, R-100).toFixed(1)},${Math.max(ly-38, 8).toFixed(1)})">` +
    `<rect width="96" height="22" rx="11" fill="#e7f0ff" stroke="rgba(8,102,255,.18)"/>` +
    `<text x="48" y="14.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0356c9">${esc(last.version)} · ${last.items} 条</text></g>` +
    xlab(0, 'start') + xlab(Math.floor((hist.length-1)/2), 'middle') + xlab(hist.length-1, 'end') +
    `</svg>`;
}

function poolRiskPill(risk){
  const r = (risk || '').toLowerCase();
  if(r === 'low') return `<span class="sys-pill accent">低风险 low</span>`;
  if(r === 'high') return `<span class="sys-pill err">高风险 high</span>`;
  if(r === 'medium') return `<span class="sys-pill warn">中风险 medium</span>`;
  return `<span class="sys-pill">未标风险 · 不会自动接</span>`;
}
function poolDeadline(t){
  const m = minsLeft(t.pool_deadline_at);
  if(m === null) return '';
  if(m <= 0) return `<span class="sys-pill err">已超时 ${-m} 分钟</span>`;
  if(m <= 10) return `<span class="sys-pill warn">剩 ${m} 分钟超时</span>`;
  return `<span class="sys-pill">截止 ${when(t.pool_deadline_at)}</span>`;
}

    `<div class="sys-mini-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#0866ff" stroke-width="1.9"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2.2" fill="#0866ff"/></svg></div>` +
    `<div><div class="sys-mini-main">情绪 · ${esc(emCur.label || '暂无快照')}${emCur.valence !== undefined ? '（效价 ' + (emCur.valence > 0 ? '+' : '') + Number(emCur.valence).toFixed(2) + '）' : ''}</div>` +
    `<div class="sys-mini-sub">${(em.mix || []).map(m => esc(m.name) + ' ' + m.pct + '%').join(' · ') || '聊几句后会生成此刻情绪'}</div></div></div>` +
    ((em.mix || []).length ? `<div class="sys-emobar">${em.mix.map(m => `<i style="width:${m.pct}%;background:${esc(m.color || '#5f6266')}"></i>`).join('')}</div>` : '') +
    `<span class="sys-jump">极光场 ↗</span></div></a>` +
    `</div>`;

  h += `</div>`;
  body.innerHTML = h;
}

async function refreshSystem(){
  try{
    const r = await fetch('/api/system');
    const d = await r.json();
    if(d && d.ok){ SYS = d.system; renderSystem(SYS); }
  }catch(e){ /* 断线时保留上一次渲染，顶栏已有连接状态 */ }
}
function startSystemTimer(){
  if(SYS_TIMER) return;
  SYS_TIMER = setInterval(() => {
    if(window.__curPage === 'system') refreshSystem();
  }, 30000);
}

document.addEventListener('click', (ev) => {
  const c = ev.target.closest('[data-goto]');
  if(c){ go(c.dataset.goto); }
});

(async function init(){
  go(localStorage.getItem('xm.page') || 'chat');
  const draft = localStorage.getItem('xm.draft');
  if(draft){ input.value = draft; input.style.height = Math.min(180, input.scrollHeight) + 'px'; }
  await loadEnv();
  await refreshStatus(true);
  await loadHistory();
  await loadApprovals();
  send.disabled = busy || (!input.value.trim() && !IMG);
  input.focus();
  setInterval(() => refreshStatus(false), 15000);
  setInterval(loadApprovals, 20000);
})();
</script>
</body>
</html>
