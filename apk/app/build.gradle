plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gongsheng.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.gongsheng.remote"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 自用分发：debug 签名即可安装（CI 的 debug.keystore 每次生成，
    // 升级安装请卸载旧版再装新版——服务端数据在电脑侧，不受影响）。
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
