plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.gongsheng.companion'
    compileSdk 34

    defaultConfig {
        applicationId "ai.gongsheng.companion"
        minSdk 24          // Android 7.0+，覆盖绝大多数设备
        targetSdk 34
        versionCode 6
        versionName "0.6-approval-btn"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 刻意零第三方依赖：WebView / Cookie / UI 全部用框架 API。
// APK-2 的 libtailscale（gomobile aar）是唯一计划中的增量。
dependencies {}
